name: Real Food till One.com
on:
  workflow_dispatch:
    inputs:
      target:
        description: Miljö att publicera till
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: real-food-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eu
          python3 -m py_compile deploy/publish.py
          find wp-content -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          python3 deploy/publish.py --check
  publish:
    if: github.ref == 'refs/heads/main'
    needs: check
    uses: ./.github/workflows/onecom.yml
    with:
      target: ${{ inputs.target }}
    secrets: inherit
